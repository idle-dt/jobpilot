[tool.poetry]
name = "jobpilot"
version = "0.1.0"
description = "Local job search autopilot — monitors email, scrapes boards, classifies listings, tracks applications"
authors = ["Denys Taranenko"]
readme = "README.md"
packages = [{include = "jobpilot", from = "src"}]

[tool.poetry.scripts]
jobpilot = "jobpilot.cli:cli"

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0"
google-api-python-client = "^2.100"
google-auth-oauthlib = "^1.1"
google-auth-httplib2 = "^0.2"
requests = "^2.31"
beautifulsoup4 = "^4.12"
lxml = "^5.0"
scikit-learn = "^1.3"
apscheduler = "^3.10"
pydantic-settings = "^2.0"
click = "^8.1"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
