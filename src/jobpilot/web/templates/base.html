<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobPilot{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;450;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <script>
    (function() {
        var t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        document.body.addEventListener('htmx:configRequest', function(event) {
            var token = document.querySelector('meta[name="csrf-token"]');
            if (token) { event.detail.headers['X-CSRFToken'] = token.content; }
        });
    });
    </script>
</head>
<body hx-boost="true">
    <div class="nav-spacer"></div>
    <nav class="nav-pill">
        <div class="nav-inner container">
            <a href="/" class="nav-brand"><strong>JobPilot</strong></a>
            {% if authenticated %}
            <div class="nav-links">
                <a href="/" {% if request.path == '/' %}class="nav-active"{% endif %}>Inbox</a>
                <a href="/emails" {% if request.path == '/emails' %}class="nav-active"{% endif %}>Emails</a>
                <a href="/stats" {% if request.path == '/stats' %}class="nav-active"{% endif %}>Stats</a>
                <a href="/tracker" {% if request.path == '/tracker' %}class="nav-active"{% endif %}>Tracker</a>
                <a href="/settings" {% if request.path == '/settings' %}class="nav-active"{% endif %}>Settings</a>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <a href="/auth/logout" class="nav-logout">Logout</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
    function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }

    /* --- Sync pipeline polling --- */
    var STEP_LABELS = {
        'starting': 'Starting sync…',
        'fetching': 'Fetching emails…',
        'classifying': 'Classifying…',
        'parsing': 'Parsing digests…',
        'fetching_arbeitnow': 'Fetching job boards…',
        'scoring': 'Scoring jobs…',
        'scraping': 'Scraping…'
    };
    var POLL_INTERVAL_MS = 3000;
    var syncPollTimer = null;
    var lastHandledFinish = null;

    function setSyncInfo(text, className) {
        var info = document.getElementById('sync-info');
        if (!info) return;
        info.textContent = text;
        info.className = className || 'sync-info';
    }

    function setSyncInfoSuccess(newEmails) {
        var info = document.getElementById('sync-info');
        if (!info) return;
        /* Build DOM nodes instead of innerHTML to avoid XSS */
        info.textContent = '';
        info.className = 'sync-info';
        var strong = document.createElement('strong');
        strong.style.color = 'var(--success)';
        strong.textContent = 'Synced';
        info.appendChild(strong);
        if (newEmails > 0) {
            info.appendChild(document.createTextNode(' \u2014 ' + newEmails + ' new email' + (newEmails !== 1 ? 's' : '')));
        }
    }

    function showSyncingUI() {
        var dot = document.getElementById('sync-dot');
        var btn = document.getElementById('sync-btn');
        var progress = document.getElementById('sync-progress');
        if (dot) dot.classList.add('syncing');
        if (btn) btn.style.visibility = 'hidden';
        if (progress) progress.classList.add('active');
    }

    function resetSyncingUI() {
        var dot = document.getElementById('sync-dot');
        var btn = document.getElementById('sync-btn');
        var progress = document.getElementById('sync-progress');
        var fill = document.getElementById('progress-fill');
        if (dot) { dot.classList.remove('syncing'); dot.style.background = ''; }
        if (btn) btn.style.visibility = '';
        if (progress) progress.classList.remove('active');
        if (fill) fill.style.width = '0%';
    }

    function stopPolling() {
        if (syncPollTimer) { clearInterval(syncPollTimer); syncPollTimer = null; }
    }

    function startPolling() {
        stopPolling();
        syncPollTimer = setInterval(pollSyncStatus, POLL_INTERVAL_MS);
    }

    function pollSyncStatus() {
        fetch('/api/sync/status').then(function(r) { return r.json(); }).then(function(data) {
            if (data.running) {
                var label = STEP_LABELS[data.step] || 'Syncing…';
                if (data.step === 'scraping' && data.total > 0) {
                    var pct = Math.round((data.current / data.total) * 100);
                    setSyncInfo('Scraping ' + data.current + '/' + data.total + '…', 'sync-info syncing');
                    var fill = document.getElementById('progress-fill');
                    if (fill) fill.style.width = pct + '%';
                } else {
                    setSyncInfo(label, 'sync-info syncing');
                    var fill = document.getElementById('progress-fill');
                    if (fill) fill.style.width = '0%';
                }
                return;
            }

            /* Not running — check terminal states */
            if (data.step === 'done' && data.finished_at && data.finished_at !== lastHandledFinish) {
                lastHandledFinish = data.finished_at;
                stopPolling();
                resetSyncingUI();
                setSyncInfoSuccess(data.new_emails || 0);
                /* Refresh review queue and toolbar stats once */
                htmx.ajax('GET', window.location.href, {target: '#review-queue', select: '#review-queue', swap: 'outerHTML'});
                htmx.ajax('GET', window.location.href, {target: '#toolbar-stats', select: '#toolbar-stats', swap: 'outerHTML'});
            } else if (data.step === 'error') {
                stopPolling();
                resetSyncingUI();
                if (data.error === 'auth_required') {
                    window.location.href = '/auth/login';
                } else {
                    setSyncInfo('Sync failed — check server logs', 'sync-info sync-error-text');
                    var dot = document.getElementById('sync-dot');
                    if (dot) dot.style.background = 'var(--danger)';
                }
            } else {
                /* Not running, not done/error — just stop polling */
                stopPolling();
            }
        }).catch(function() {});
    }

    function startSync() {
        var token = document.querySelector('meta[name="csrf-token"]');
        showSyncingUI();
        setSyncInfo('Starting sync…', 'sync-info syncing');
        fetch('/api/sync', {
            method: 'POST',
            headers: {
                'X-CSRFToken': token ? token.content : '',
                'Content-Type': 'application/json'
            }
        }).then(function(r) { return r.json(); }).then(function(data) {
            if (data.status === 'started' || data.status === 'already_running') {
                startPolling();
            }
        }).catch(function() {
            resetSyncingUI();
            setSyncInfo('Sync failed', 'sync-info sync-error-text');
        });
    }

    /* On page load: check if a sync is already running */
    (function() {
        fetch('/api/sync/status').then(function(r) { return r.json(); }).then(function(data) {
            if (data.running) {
                showSyncingUI();
                setSyncInfo(STEP_LABELS[data.step] || 'Syncing…', 'sync-info syncing');
                startPolling();
            } else if (data.step === 'done' && data.finished_at) {
                lastHandledFinish = data.finished_at;
            }
        }).catch(function() {});
    })();
    </script>
    <script src="{{ url_for('static', filename='tracker.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
