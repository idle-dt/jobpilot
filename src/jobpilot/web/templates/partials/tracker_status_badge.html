<span class="tracker-badge-wrap" id="status-{{ app.id }}">
    <span class="status-badge status-{{ app.status }}"
          onclick="this.style.display='none'; var sel=this.parentElement.querySelector('.status-select'); sel.style.display='inline-block'; sel.focus();">
        {{ status_labels.get(app.status, app.status) }}
    </span>
    <select class="status-select" style="display:none"
            hx-post="/api/tracker/{{ app.id }}/status"
            hx-target="#status-{{ app.id }}"
            hx-swap="outerHTML"
            hx-trigger="change"
            name="status"
            onblur="if(!this._changed){this.style.display='none'; this.previousElementSibling.style.display='';}"
            onchange="this._changed=true;">
        {% for s in statuses %}
        <option value="{{ s }}" {% if s == app.status %}selected{% endif %}>{{ status_labels[s] }}</option>
        {% endfor %}
    </select>
</span>
