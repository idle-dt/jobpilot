<span id="status-{{ app.id }}">
    <select class="status-select status-{{ app.status }}"
            hx-post="/api/tracker/{{ app.id }}/status"
            hx-target="#status-{{ app.id }}"
            hx-swap="outerHTML"
            hx-trigger="change"
            name="status">
        {% for s in statuses %}
        <option value="{{ s }}" {% if s == app.status %}selected{% endif %}>{{ status_labels[s] }}</option>
        {% endfor %}
    </select>
</span>
