<tr id="app-row-{{ app.id }}" class="{% if app.status in ('rejected', 'withdrawn', 'no_response') %}tracker-row-dimmed{% endif %}">
    <td>
        <a class="role-link" href="#"
           hx-get="/api/tracker/{{ app.id }}"
           hx-target="#modal-container"
           hx-swap="innerHTML"
           onclick="event.preventDefault()">{{ app.role_title }}</a>
    </td>
    <td>{{ app.company }}</td>
    <td class="tracker-muted">{{ app.location or '' }}{% if app.remote %} / Remote{% endif %}</td>
    <td>{% include "partials/tracker_status_badge.html" %}</td>
    <td class="tracker-muted">{{ app.platform or '' }}</td>
    <td class="tracker-muted">{% if app.applied_at %}{{ app.applied_at[:10] }}{% endif %}</td>
</tr>
